name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint shell and YAML
        run: make lint
