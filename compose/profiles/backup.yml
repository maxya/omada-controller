services:
  mongodb-backup:
    image: ${MONGO_IMAGE:-mongo:8.2}
    networks:
      - omada-controller
    profiles:
      - backup
    environment:
      OMADA_MONGO_BACKUP_USER: ${OMADA_MONGO_BACKUP_USER:-omada_backup}
      OMADA_MONGO_BACKUP_PASSWORD: ${OMADA_MONGO_BACKUP_PASSWORD:?set OMADA_MONGO_BACKUP_PASSWORD}
      BACKUP_DIR: /backups
    volumes:
      - ../backups:/backups
    entrypoint:
      - /bin/sh
      - -ec
      - |
        ts="$$(date -u +%Y%m%dT%H%M%SZ)"
        out="$${BACKUP_DIR}/mongodb/$${ts}"
        mkdir -p "$${out}"
        mongodump \
          --host mongodb \
          --port 27017 \
          --username "$${OMADA_MONGO_BACKUP_USER}" \
          --password "$${OMADA_MONGO_BACKUP_PASSWORD}" \
          --authenticationDatabase admin \
          --out "$${out}"
        echo "MongoDB backup written to $${out}"

networks:
  omada-controller:
    name: omada-controller
